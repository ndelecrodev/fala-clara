name: Bug
description: Algo não funciona como deveria
title: "fix: "
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Área
      options:
        - web (front-end)
        - api (back-end)
        - docs
        - outro
    validations:
      required: true
  - type: textarea
    id: descricao
    attributes:
      label: O que aconteceu
      description: Descreva o problema de forma objetiva.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abra...
        2. Clique em...
        3. Veja o erro...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: ambiente
    attributes:
      label: Ambiente
      description: Navegador e versão, sistema operacional, leitor de tela (se usado).
  - type: textarea
    id: evidencias
    attributes:
      label: Evidências
      description: Prints, gravações ou logs. Não inclua dados pessoais nem textos ditados reais.
